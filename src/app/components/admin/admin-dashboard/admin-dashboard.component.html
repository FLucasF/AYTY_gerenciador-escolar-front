<body class="home">
    <!-- Container principal unificado -->
    <div id="main-content" class="user-dashboard">
      <h1>Usuários Cadastrados</h1>
      
      <!-- Filtro -->
      <div class="form-group">
        <label for="tipoUsuario">Filtrar por tipo:</label>
        <select id="tipoUsuario" [(ngModel)]="tipoUsuarioSelecionado" (change)="filtrarUsuarios()" class="form-control">
          <option value="todos">Todos</option>
          <option value="administrador">Administrador</option>
          <option value="professor">Professor</option>
          <option value="aluno">Aluno</option>
        </select>
      </div>
      
      <hr />
      
      <!-- Botão de Adicionar Usuário -->
      <button (click)="irParaCadastro()" class="btn btn-success btn-block">
        <i class="fa fa-plus"></i> Adicionar Novo Usuário
      </button>
      
      <hr />
      
      <!-- Lista de Usuários (Desktop) -->
      <div class="table-responsive desktop-table">
        <table class="table table-striped table-hover">
          <thead class="thead-dark">
            <tr>
              <th>Tipo</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Informação Extra</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filtrarUsuarios()">
              <td>{{ user.tipo | titlecase }}</td>
              <td>{{ user.nome }}</td>
              <td>{{ user.email }}</td>
              <td>{{ obterInformacaoExtra(user) }}</td>
              <td>
                <button (click)="irParaEdicao(user)" class="btn btn-warning btn-sm">
                  <i class="fa fa-pencil"></i> Editar
                </button>
                <button (click)="excluirUsuario(user)" class="btn btn-danger btn-sm">
                  <i class="fa fa-trash"></i> Excluir
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- Lista de Usuários (Mobile) -->
      <div class="mobile-list">
        <ul class="list-group">
          <li class="list-group-item" *ngFor="let user of filtrarUsuarios()">
            <div>
              <strong>{{ user.tipo | titlecase }}</strong>
            </div>
            <div>Nome: {{ user.nome }}</div>
            <div>Email: {{ user.email }}</div>
            <div>Informação Extra: {{ obterInformacaoExtra(user) }}</div>
            <div class="mt-2">
              <button (click)="irParaEdicao(user)" class="btn btn-warning btn-sm">
                <i class="fa fa-pencil"></i> Editar
              </button>
              <button (click)="excluirUsuario(user)" class="btn btn-danger btn-sm">
                <i class="fa fa-trash"></i> Excluir
              </button>
            </div>
          </li>
        </ul>
      </div>
      
      <!-- Paginação -->
      <div class="pagination-container">
        <span class="page-item prev" (click)="mudarPagina(currentPage - 1)" [class.disabled]="currentPage === 0">
          &#10094;
        </span>
        <span class="page-item next" (click)="mudarPagina(currentPage + 1)" [class.disabled]="currentPage >= totalPages - 1">
          &#10095;
        </span>
      </div>
    </div>
  </body>
