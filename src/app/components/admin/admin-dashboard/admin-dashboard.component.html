<body class="home">
  <div class="container-fluid display-table">
      <div class="row display-table-row">
          <!-- Sidebar -->
          <div class="col-md-2 col-sm-2 hidden-xs display-table-cell v-align box" id="navigation">
            <div class="navi">
              <ul>
                <li><a routerLink="/admin"><i class="fa fa-home"></i> Painel</a></li>
                <li><a routerLink="/admin/cadastro"><i class="fa fa-user-plus"></i> Cadastrar Usuário</a></li>
                <li><a routerLink="/admin/turmas"><i class="fa fa-users"></i> Gerenciar Turmas</a></li>
                <li><a routerLink="/board"><i class="fa fa-clipboard"></i> Board</a></li>
                <li><a routerLink="/logout"><i class="fa fa-sign-out-alt"></i> Sair</a></li>
              </ul>
            </div>
          </div>

          <!-- Conteúdo Principal -->
          <div class="col-md-10 col-sm-10 display-table-cell v-align" style="padding: 20px;">
              <div class="user-dashboard">
                  <h1>Usuários Cadastrados</h1>
                  <!-- Filtro -->
                  <div class="form-group">
                      <label for="tipoUsuario">Filtrar por tipo:</label>
                      <select [(ngModel)]="tipoUsuarioSelecionado" (change)="filtrarUsuarios()" class="form-control">
                          <option value="todos">Todos</option>
                          <option value="administrador">Administrador</option>
                          <option value="professor">Professor</option>
                          <option value="aluno">Aluno</option>
                      </select>
                  </div>
                  <hr />
                  <!-- Botão de Adicionar Usuário -->
                  <button (click)="irParaCadastro()" class="btn btn-success btn-block">
                      <i class="fa fa-plus"></i> Adicionar Novo Usuário
                  </button>
                  <hr />
                  <!-- Lista de Usuários -->
                  <ul class="list-group">
                      <li class="list-group-item" *ngFor="let user of filtrarUsuarios()">
                          <span>
                              <strong>{{ user.nome }}</strong> - {{ user.email }}
                              <span *ngIf="user.tipo === 'aluno'"> - CPF: {{ user.cpf }}</span>
                              <span *ngIf="user.tipo === 'administrador'"> - Setor: {{ user.setor }}</span>
                              <span *ngIf="user.tipo === 'professor'"> - Departamento: {{ user.departamento }}</span>
                          </span>
                          <div class="pull-right">
                              <button (click)="irParaEdicao(user)" class="btn btn-warning btn-sm">
                                  <i class="fa fa-pencil"></i> Editar
                              </button>
                              <button (click)="excluirUsuario(user)" class="btn btn-danger btn-sm">
                                  <i class="fa fa-trash"></i> Excluir
                              </button>
                          </div>
                      </li>
                  </ul>
                  <!-- Paginação -->
                  <div class="pagination-container">
                      <button (click)="mudarPagina(0)" [disabled]="currentPage === 0" class="btn btn-secondary">
                        << Primeira
                      </button>
                      <button (click)="mudarPagina(currentPage - 1)" [disabled]="currentPage === 0" class="btn btn-secondary">
                        < Anterior
                      </button>
                      <span>Página {{ currentPage + 1 }} de {{ totalPages }}</span>
                      <button (click)="mudarPagina(currentPage + 1)" [disabled]="currentPage >= totalPages - 1" class="btn btn-secondary">
                        Próxima >
                      </button>
                      <button (click)="mudarPagina(totalPages - 1)" [disabled]="currentPage >= totalPages - 1" class="btn btn-secondary">
                        Última >>
                      </button>
                  </div>
              </div>
          </div>
      </div>
  </div>
</body>
