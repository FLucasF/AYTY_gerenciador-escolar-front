<div class="user-dashboard">
  <h1>Gerenciar Alunos - {{ turmaNome }}</h1>
  <hr />

  <!-- Lista de Alunos Matriculados -->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Alunos Matriculados</h3>
    </div>
    <div class="card-body">
      <ul class="list-group">
        <li class="list-group-item d-flex align-items-center" *ngFor="let aluno of paginaAlunos?.content">
          <div class="aluno-nome flex-grow-1">
            {{ aluno.nome }}
          </div>
          <button class="btn btn-danger btn-sm ms-3" (click)="removerAlunoDaTurma(aluno.id!)" [disabled]="loadingAlunos">
            <i class="fa fa-trash"></i> Remover
          </button>
        </li>
      </ul>
      

      <p *ngIf="paginaAlunos?.content?.length === 0" class="text-center text-muted mt-3">
        Nenhum aluno matriculado.
      </p>
    </div>
  </div>

  <!-- Paginação -->
  <mat-paginator [length]="totalElements" [pageIndex]="pageIndex" [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25, 50]" (page)="carregarAlunosDaTurma($event)">
  </mat-paginator>

  <!-- Adicionar Aluno -->
  <div class="card mt-4">
    <div class="card-header">
      <h3 class="card-title">Adicionar Aluno</h3>
    </div>
    <div class="card-body">
      <div class="form-group">
        <select class="form-control" [(ngModel)]="alunoSelecionadoParaAdicionar" [disabled]="loadingAlunos">
          <option [ngValue]="null">Selecione um aluno</option>
          <option *ngFor="let aluno of todosAlunos" [ngValue]="aluno.id">
            {{ aluno.nome }} ({{ aluno.email }})
          </option>
        </select>
      </div>

      <div *ngIf="loadingAlunos" class="text-center mt-2">
        <div class="spinner-border text-primary" role="status" aria-label="Carregando">
          <span class="sr-only">Carregando...</span>
        </div>
      </div>

      <button class="btn btn-primary btn-block mt-3" (click)="adicionarAlunoNaTurma()"
        [disabled]="!alunoSelecionadoParaAdicionar || loadingAlunos">
        <i class="fa fa-user-plus"></i> Matricular Aluno
      </button>
    </div>
  </div>

  <!-- Botão Fechar -->
  <div class="text-center mt-4">
    <button type="button" class="btn btn-secondary" (click)="voltarParaTurmas()">
      <i class="fa fa-times"></i> Fechar
    </button>
  </div>
</div>
