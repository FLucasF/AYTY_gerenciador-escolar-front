<div class="user-dashboard">
  <h1>Gerenciar Alunos - {{ turmaNome }}</h1>
  <hr />

  <!-- Lista de Alunos Matriculados -->
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Alunos Matriculados</h3>
    </div>
    <div class="card-body">
      <ul class="list-group">
        <li class="list-group-item d-flex align-items-center" *ngFor="let aluno of paginaAlunos?.content">
          <div class="aluno-nome flex-grow-1">
            {{ aluno.nome }}
          </div>
          <button class="btn btn-danger btn-sm ms-3" (click)="removerAlunoDaTurma(aluno.id!)" [disabled]="loadingAlunos">
            <i class="fa fa-trash"></i> Remover
          </button>
        </li>
      </ul>
      <p *ngIf="paginaAlunos?.content?.length === 0" class="text-center text-muted mt-3">
        Nenhum aluno matriculado.
      </p>
    </div>
  </div>

  <!-- Paginação para Alunos Matriculados -->
  <mat-paginator [length]="totalElements" [pageIndex]="pageIndex" [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 25, 50]" (page)="carregarAlunosDaTurma($event)">
  </mat-paginator>

  <!-- Lista de Alunos Disponíveis para Adicionar -->
  <div class="card mt-4">
    <div class="card-header">
      <h3 class="card-title">Adicionar Aluno</h3>
    </div>
    <div class="card-body">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Opções</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let aluno of availableAlunosPaginated">
            <td>{{ aluno.nome }}</td>
            <td>{{ aluno.email }}</td>
            <td>
              <button class="btn btn-primary btn-sm" (click)="adicionarAlunoNaTurma(aluno.id!)"
                [disabled]="loadingAlunos">
                <i class="fa fa-user-plus"></i> Adicionar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <p *ngIf="alunosDisponiveis?.length === 0" class="text-center text-muted mt-3">
        Nenhum aluno disponível para adicionar.
      </p>
    </div>
  </div>

  <!-- Paginação para Alunos Disponíveis (local) -->
  <mat-paginator [length]="alunosDisponiveis.length" [pageIndex]="availablePageIndex" [pageSize]="availablePageSize"
    [pageSizeOptions]="[5, 10, 25, 50]" (page)="onAvailablePageChange($event)">
  </mat-paginator>

  <!-- Botão Fechar -->
  <div class="text-center mt-4">
    <button type="button" class="btn btn-secondary" (click)="voltarParaTurmas()">
      <i class="fa fa-times"></i> Fechar
    </button>
  </div>
</div>
