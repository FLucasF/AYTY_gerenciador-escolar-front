<body class="home">
  <div class="container-fluid display-table">
    <div class="row display-table-row">
      <!-- Conteúdo Principal -->
      <div class="col-md-10 col-sm-10 display-table-cell v-align" style="padding: 20px;">
        <div class="user-dashboard">
          <h1>Editar Usuário</h1>
          <div class="panel panel-default">
            <div class="panel-heading">
              <h3 class="panel-title">Edição de Usuário</h3>
            </div>
            <div class="panel-body">
              <form [formGroup]="editForm" (ngSubmit)="salvarEdicao()">
                
                <!-- Nome -->
                <div class="form-group">
                  <label>Nome</label>
                  <input type="text" class="form-control" formControlName="nome">
                  <small *ngIf="editForm.get('nome')?.hasError('required') && editForm.get('nome')?.touched" class="text-danger">
                    Nome é obrigatório.
                  </small>
                </div>

                <!-- CPF -->
                <div class="form-group">
                  <label>CPF</label>
                  <input type="text" class="form-control" formControlName="cpf">
                  <small *ngIf="editForm.get('cpf')?.hasError('required') && editForm.get('cpf')?.touched" class="text-danger">
                    CPF é obrigatório.
                  </small>
                </div>

                <!-- Email -->
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" class="form-control" formControlName="email">
                  <small *ngIf="editForm.get('email')?.hasError('required') && editForm.get('email')?.touched" class="text-danger">
                    Email é obrigatório.
                  </small>
                </div>

                <!-- Senha -->
                <div class="form-group">
                  <label>Senha</label>
                  <input type="password" class="form-control" formControlName="senha" placeholder="Deixe em branco para não alterar">
                  <small *ngIf="editForm.get('senha')?.hasError('minlength') && editForm.get('senha')?.touched" class="text-danger">
                    A senha deve ter pelo menos 8 caracteres.
                  </small>
                </div>

                <!-- Campos específicos para Administrador -->
                <div *ngIf="tipoUsuario === 'administrador'">
                  <div class="form-group">
                    <label>Setor</label>
                    <input type="text" class="form-control" formControlName="setor">
                  </div>
                  <div class="form-group">
                    <label>SIAPE</label>
                    <input type="text" class="form-control" formControlName="siape">
                  </div>
                </div>

                <!-- Campos específicos para Professor -->
                <div *ngIf="tipoUsuario === 'professor'">
                  <div class="form-group">
                    <label>Departamento</label>
                    <input type="text" class="form-control" formControlName="departamento">
                  </div>
                  <div class="form-group">
                    <label>SIAPE</label>
                    <input type="text" class="form-control" formControlName="siape">
                  </div>
                </div>

                <!-- Campos específicos para Aluno -->
                <div *ngIf="tipoUsuario === 'aluno'">                  
                  <div class="form-group">
                    <label>Curso</label>
                    <input type="text" class="form-control" formControlName="curso">
                  </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                  <i class="fa fa-save"></i> Salvar Alterações
                </button>
                <button type="button" (click)="cancelar()" class="btn btn-secondary btn-block">
                  Cancelar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
