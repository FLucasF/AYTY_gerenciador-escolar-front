<div class="panel panel-default">
  <div class="panel-heading"><h3 class="panel-title">Lista de Turmas</h3></div>
  <div class="panel-body">
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let turma of turmas">
        <span>
          <strong>{{ turma.nome }}</strong> - Código: {{ turma.codigo }} - Semestre: {{ turma.semestre }} 
          - Professor: {{ turma.professorId ? (professoresMap.get(turma.professorId) || 'Sem professor') : 'Sem professor' }}
        </span>

        <div class="pull-right">
          <button class="btn btn-warning btn-sm" (click)="iniciarEdicao(turma)">
            <i class="fa fa-pencil"></i> Editar
          </button>
          <button class="btn btn-info btn-sm mx-2" (click)="navegarParaGerenciarAlunos(turma.id)">
            <i class="fa fa-users"></i> Gerenciar Alunos
          </button>
          
          <button class="btn btn-danger btn-sm" *ngIf="turma.id" (click)="excluirTurma(turma.id)">
            <i class="fa fa-trash"></i> Excluir
          </button>
        </div>
      </li>
    </ul>

    <div *ngIf="turmas.length === 0" class="text-center text-muted mt-3">
      <p>Nenhuma turma cadastrada.</p>
    </div>
  </div>
</div>
