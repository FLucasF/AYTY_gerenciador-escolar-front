server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # Estudar mais os possiveis gzip, o que colocar o que mudar, pq mudar

    # Ativar Gzip para melhorar tempo de carregamento
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;

    # Cache de arquivos estáticos para melhorar performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|json)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000";
    }

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}